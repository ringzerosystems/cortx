[workspace]
resolver = "2"
members = [
    "crates/cortx-core",
    "crates/cortx-distill",
    "crates/cortx-daemon",
    "crates/cargo-cortx",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.85.0"
license = "AGPL-3.0-only OR LicenseRef-RingZero-Commercial"
authors = ["Mark Horila / RingZero Systems <licensing@ringzerosystems.com>"]

[workspace.dependencies]
cortx-core = { path = "crates/cortx-core" }
cortx-distill = { path = "crates/cortx-distill" }
cortx-daemon = { path = "crates/cortx-daemon" }

syn = { version = "2.0", features = ["full", "visit", "visit-mut", "extra-traits"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
prettyplease = "0.2"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7" }
colored = "3.0"
anstream = "0.6"
proptest = "1.6"
notify = "8.0"
tempfile = "3.17"
bytes = "1.10"
parking_lot = "0.12"
rand = "0.8"
walkdir = "2.5"
regex = "1.11"
oxc_allocator = "0.75"
oxc_parser = "0.75"
oxc_span = "0.75"
oxc_ast = "0.75"
oxc_resolver = { version = "=11.13.1", default-features = false }
globset = { version = "=0.4.18", default-features = false }
tree-sitter = "0.26"
tree-sitter-go = "0.25"
rayon = "1.10"
rustc-hash = "2.1"
mimalloc = { version = "0.1", default-features = false }
